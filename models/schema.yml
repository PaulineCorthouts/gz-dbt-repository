version: 2

sources:
   - name: raw
     schema: gz_raw_data
     tables:
       - name: sales 
         identifier: raw_gz_sales
         description: sales of Greenweez / we have one row per product_id found in each orders_id
         columns: 
           - name: date_date
             description: date of purchase 
           - name: orders_id
             description: order reference 
           - name: pdt_id
             description: product reference 
           - name: revenue
             description: turnover per product
           - name: quantity
             description: qty of sold products
         tests:
           - unique:
               column_name: "(orders_id || '-' || pdt_id)"     
       - name: ship
         identifier: raw_gz_ship
         description: shipping of Greenweez / we have one row per orders_id
         columns: 
           - name: orders_id
             description: order id
             tests:
               - not_null
               - unique
           - name: shipping_fee
             description: ship fee
           - name: shipping_fee_1
             description: ship fee
           - name: logCost
             description: logistics cost
           - name: ship_cost
             description: cost of shipment
       - name: product
         identifier: raw_gz_product
         description: Products of Greenweez / we have one row per products_id
         columns: 
           - name: products_id
             description: product reference
             tests:
               - not_null
               - unique
           - name: purchSE_PRICE
             description: price of purchase
       - name: adwords
         identifier: raw_gz_adwords
         description: Adwords of Greenweez / we have one row per day
         columns: 
           - name: date_date
             description: campaign date
             tests:
               - not_null
           - name: paid_source
             description: source of the campainn
           - name: campaign_key
             description: campaign ref
           - name: camPGN_name
             description: campaign name
           - name: ads_cost
             description: cost of the add for company
           - name: impression
             description: nb of views
           - name: click
             description: nb clicks to check out ad
       - name: bing
         identifier: raw_gz_bing
         description: bing of Greenweez / we have one row per day
         columns: 
           - name: date_date
             description: campaign date
             tests:
               - not_null
           - name: paid_source
             description: source of the campainn
           - name: campaign_key
             description: campaign ref
           - name: camPGN_name
             description: campaign name
           - name: ads_cost
             description: cost of the add for company
           - name: impression
             description: nb of views
           - name: click
             description: nb clicks to check out ad             
       - name: criteo
         identifier: raw_gz_criteo
         description: criteo of Greenweez / we have one row per day
         columns: 
           - name: date_date
             description: campaign date
             tests:
               - not_null
           - name: paid_source
             description: source of the campainn
           - name: campaign_key
             description: campaign ref
           - name: camPGN_name
             description: campaign name
           - name: ads_cost
             description: cost of the add for company
           - name: impression
             description: nb of views
           - name: click
             description: nb clicks to check out ad   
       - name: facebook
         identifier: raw_gz_facebook
         description: facebook of Greenweez / we have one row per day
         columns: 
           - name: date_date
             description: campaign date
             tests:
               - not_null
           - name: paid_source
             description: source of the campainn
           - name: campaign_key
             description: campaign ref
           - name: camPGN_name
             description: campaign name
           - name: ads_cost
             description: cost of the add for company
           - name: impression
             description: nb of views
           - name: click
             description: nb clicks to check out ad   
models:
   - name: int_sales_margin
     description: margin calculation per order
     columns:
       - name: orders_id
         description: orders key
         tests:
           - not_null
       - name: products_id
         description: products key
         tests:
           - not_null
       - name: margin
         description: Margin = Revenue - Purchase_cost
         tests:
           - not_null
       - name: purchase_cost
         description: purchase_cost = Quantity * Purchase_price
         tests:
           - not_null
       - name: date_date
         description: date of the order
         tests:
           - not_null
       - name: revenue
         description: sum of revenue per order
         tests:
           - not_null
       - name: quantity
         description: sum of quantity per order
         tests:
           - not_null
     tests:
       - unique:
           column_name: "(orders_id || '-' || products_id)"
